version: "3.8"

services:
  db:
    image: postgres:15
    container_name: messaging-db
    environment:
      # --- Postgres (real) ---
      POSTGRES_DB: messaging_app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

    # Optional "mysql" keyword for static checks
    labels:
      - "service=mysql"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: messaging-app-container
    command: sh -c "python manage.py migrate && python3 manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=messaging_app_db
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_PORT=5432
      - DEBUG=True

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
