version: '3.8'

services:
  db:
    image: postgres:15
    container_name: messaging-db
    environment:
      POSTGRES_DB: messaging_app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Sxeteaact2p9
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: messaging-app-container
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=messaging_app_db
      - DB_USER=postgres
      - DB_PASSWORD=Sxeteaact2p9
      - DB_PORT=5432
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - SECRET_KEY=django-insecure-mysecretkey12345
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
